name: Bug report
description: Something behaves differently than documented.
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: placeholder
    attributes:
      label: The placeholder involved
      description: >-
        The exact marker line from your Markdown file, if the problem is about
        a specific placeholder.
      render: markdown

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The command or workflow step you ran. Please redact your API key.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Action tag or `wakatime-readme --version`.
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it
      options:
        - GitHub Action
        - CLI
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed my WakaTime API key from everything pasted above.
          required: true
