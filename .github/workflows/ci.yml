name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run task lint
      - run: uv run task typecheck

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # Deliberately not `task test`: its pre_test hook re-runs lint, which the
      # quality job already did once. No need to pay for it on every matrix leg.
      - run: uv run pytest --cov=src --cov-report=term-missing

  action:
    name: action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A file of GitHub-only placeholders, so the run needs no secret.
      # This exercises the container, the input plumbing and the rule
      # that a provider nobody asked for is never contacted.
      - name: Write a sample document
        run: |
          echo 'stars: <!--wr:gh_stars-->0<!--/wr-->' > sample.md

      - uses: ./
        with:
          readme_path: sample.md
          username: ${{ github.repository_owner }}
          dry_run: 'true'
