name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run task lint
      - run: uv run task typecheck

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # Deliberately not `task test`: its pre_test hook re-runs lint, which the
      # quality job already did once. No need to pay for it on every matrix leg.
      - run: uv run pytest --cov=src --cov-report=term-missing

  action:
    name: action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately not `uses: ./`. action.yml now points at the
      # published image, so running the action here would test the last
      # release rather than this commit. Building the Dockerfile directly
      # keeps the container, the entrypoint and the INPUT_* plumbing
      # under test.
      - name: Build the image from this commit
        run: docker build -t wakatime-readme:ci .

      # A file of GitHub-only placeholders, so the run needs no secret.
      # GITHUB_REPOSITORY is deliberately not passed through: with no
      # repository the tool edits the mounted file, which is what makes
      # the resolved value visible to the assertion below.
      - name: Resolve a sample document
        run: |
          echo 'stars: <!--wr:gh_stars-->0<!--/wr-->' > sample.md
          docker run --rm             -v "$PWD:/github/workspace" -w /github/workspace             -e INPUT_README_PATH=sample.md             -e INPUT_USERNAME=${{ github.repository_owner }}             -e INPUT_GITHUB_TOKEN=${{ github.token }}             -e INPUT_DRY_RUN=true             wakatime-readme:ci | tee report.txt

      # Without this the job passes on a container that started and
      # resolved nothing, which is how the old self-test stayed green
      # while reaching no data at all.
      - name: Fail unless the placeholder actually resolved
        run: grep -q 'gh_stars' report.txt

  # The one check the branch ruleset requires by name. GitHub names a check
  # run after the JOB, never after the workflow, so requiring "CI" -- the
  # workflow's name -- could never be satisfied and left every pull request
  # waiting on a context that does not exist. This job supplies it.
  #
  # It also survives a matrix change: naming `tests (py3.14)` and friends
  # directly would mean editing the ruleset every time a Python version is
  # added or dropped. Everything funnels through here instead.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [quality, test, action]
    # Without always() this is skipped when something upstream fails, and a
    # skipped required check can read as satisfied -- the gate would wave
    # through exactly the runs it exists to stop.
    if: always()
    steps:
      # Handed over as an environment variable rather than interpolated
      # into the script body: an expression's value never becomes shell
      # source that way. Note the separator is single-quoted -- Actions
      # expressions accept no other quote character.
      - name: Fail unless every job above succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed: $RESULTS"
              exit 1
            fi
          done
