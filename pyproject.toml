[project]
name = 'wakatime-readme'
version = '1.1.0'
description = 'Dev metrics with Wakatime for your README.md'
readme = 'README.md'
requires-python = '>=3.11'
license = 'MIT'
license-files = ['LICENSE']
authors = [{ name = 'Marcelo Machado' }]
keywords = [
  'wakatime',
  'readme',
  'github-action',
  'metrics',
  'badge',
  'profile',
]
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Environment :: Console',
  'Intended Audience :: Developers',
  'Natural Language :: English',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Programming Language :: Python :: Implementation :: CPython',
  'Topic :: Software Development :: Documentation',
  'Topic :: Utilities',
  'Typing :: Typed',
]

dependencies = []

[project.scripts]
wakatime-readme = 'wakatime_readme.main:main'

[project.urls]
Homepage = 'https://github.com/mmaachado/wakatime-readme'
Repository = 'https://github.com/mmaachado/wakatime-readme'
Issues = 'https://github.com/mmaachado/wakatime-readme/issues'
Changelog = 'https://github.com/mmaachado/wakatime-readme/blob/master/CHANGELOG.md'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.ruff]
line-length = 79
target-version = 'py311'
src = ['src', 'tests']

[tool.ruff.lint]
select = [
  'E',
  'W',
  'F',
  'I',
  'UP',
  'B',
  'C4',
  'C90',
  'SIM',
  'PT',
  'ANN',
  'S',
  'D',
  'RUF',
]

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['S101', 'D']

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
python_version = '3.11'
strict = true
files = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.coverage.run]
source = ['src']
branch = true

[tool.taskipy.tasks]
lint = 'ruff check . && ruff format --check .'
format = 'ruff check --fix . && ruff format .'
typecheck = 'mypy src'
pre_test = 'task lint'
test = 'pytest -s -x --cov=src -vv'
post_test = 'coverage html'
docs = 'mkdocs serve'
# --strict turns a broken link into a failure, which is the only thing
# that makes the docs job in CI worth running.
docs_build = 'mkdocs build --strict'

[dependency-groups]
dev = [
  "mike>=2.1.3",
  "mkdocs-shadcn>=0.12.1",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.4",
  "taskipy>=1.14.1",
]
